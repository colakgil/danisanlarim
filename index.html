<script>
  // Çevrimdışı çalışma: sw.js yalnızca yayın paketinde (tools/yayin-hazirla.js) bulunur; geliştirmede yoksa kayıt sessizce atlanır
  if ('serviceWorker' in navigator) {
    const vardi = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    // Yeni sürüm yüklendi: sayfa eski dosyalarla açık → yenilemeyi öner (yazılanlar zaten kaydedildi)
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!vardi || document.getElementById('surum-bildirim')) return;
      const b = document.createElement('button');
      b.id = 'surum-bildirim'; b.className = 'surum-bildirim'; b.textContent = 'Uygulama güncellendi · yenilemek için dokunun';
      b.onclick = () => location.reload();
      document.body.append(b);
    });
  }
</script>
